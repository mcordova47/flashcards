# Refuses a broken merge. A merge to main is not a deploy: Netlify builds the
# production branch, which the maintainer moves in batches. This says whether
# what was merged should have been. See #23.
name: check

# Both, and they answer different questions. `pull_request` tests the *merge
# result*, which is the thing being asked about and which no branch contains -
# two branches that each pass alone can break together, and the drift check is
# exactly the kind that would only notice on the merge commit. `push` on main
# is the net for anything that lands without a pull request, and, since a branch
# no longer has to be up to date to merge (#206), for two pull requests that each
# passed against a `main` that did not yet have the other.
#
# Branches are left to their pull request rather than run on every push, or
# every run happens twice.
on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so that adding `slug-change` re-runs the check it excuses.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Several agents pushing at once means several runs that no longer matter.
# Keep the newest per branch and stop the rest; main is exempt, since a
# cancelled run there would leave a merged commit with no answer.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Whether this change needs the suites at all. A pull request that touches
  # only Markdown (outside `.claude/` and `data/`, which are instructions agents
  # follow and the source of generated modules) does not. It runs in seconds
  # and every other job reads its answer.
  #
  # The jobs below are skipped *step by step*, never as whole jobs, where a
  # check is read by name. `data` and `browser` finish in seconds and report
  # `success`; a job skipped by a condition would report `skipped`, which branch
  # protection accepts but `deploy` does not (it requires exactly
  # `browser=success data=success` on the commit it ships), so a Markdown-only
  # head commit would be refused. `main` and anything not a pull request always
  # run everything: it is the net for what a pull request missed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      # On a pull request this is the merge commit, whose first parent is the
      # base. Depth 2 reaches it. `--no-renames` lists both sides of a rename,
      # so a .js file renamed to .md is not mistaken for documentation.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: detect
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --no-renames --name-only HEAD^1 HEAD)
            echo "$files"
            # An empty list is not evidence of documentation: run everything.
            if [ -n "$files" ]; then
              code=false
              while IFS= read -r f; do
                case "$f" in
                  .claude/*|data/*) code=true ;;
                  *.md) ;;
                  *) code=true ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"
        env:
          EVENT: ${{ github.event_name }}

  # Seconds, no browser. The drift check is the one thing nothing else covers:
  # the app reads the generated modules, people read the CSVs, and a commit
  # that edits one without the other would otherwise ship the old cells.
  data:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 24
          cache: npm
      - if: needs.changes.outputs.code == 'true'
        run: npm ci

      # Every generator is deterministic, so a module regenerated from its CSV
      # is byte-identical unless one of them is stale. Run before anything else
      # can touch the tree.
      - name: Generated modules match their CSVs
        if: needs.changes.outputs.code == 'true'
        run: |
          npm run -s sync
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::A generated module is out of date with its CSV. Run \`npm run sync\` and commit the result."
            exit 1
          fi

      # A slug is what a card's history is keyed by, so one that changes on a
      # word still in the deck is refused. Against the pull request's base,
      # never HEAD, which already has the change. A deliberate one carries the
      # `slug-change` label; pushes to main are not compared with themselves.
      - name: No slug changed on a word still in the deck
        if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          node tools/check-slugs.mjs --base "origin/${{ github.base_ref }}" $FLAGS
        env:
          FLAGS: ${{ contains(github.event.pull_request.labels.*.name, 'slug-change') && '--drop-pins' || '' }}

      # Structural only: deviations from the regular pattern are its output,
      # not a failure, and it exits zero for them.
      - if: needs.changes.outputs.code == 'true'
        run: npm run -s check-ipa
      - if: needs.changes.outputs.code == 'true'
        run: npm run -s check-verbs
      - if: needs.changes.outputs.code == 'true'
        run: npm run -s check-paraphrase
      - if: needs.changes.outputs.code == 'true'
        run: npm run -s check-sentences
      - if: needs.changes.outputs.code == 'true'
        run: npm run -s check-por-para

      # The issue queue's ordering and what it does with a contradicting label.
      # Pure node, so it needs neither the build nor GitHub.
      - if: needs.changes.outputs.code == 'true'
        run: node test/queue.mjs
      - if: needs.changes.outputs.code == 'true'
        run: node test/cors.mjs

      - uses: actions/cache@v4
        if: needs.changes.outputs.code == 'true'
        with:
          path: |
            .spago
            ~/.cache/spago-nodejs
          key: spago-${{ hashFiles('spago.lock') }}
      - if: needs.changes.outputs.code == 'true'
        run: npm test

      # The notes endpoint and `npm run notes`, against Netlify's own local
      # blob server. After `npm test`, which builds the output/ it checks the
      # listing against.
      - if: needs.changes.outputs.code == 'true'
        run: node test/notes.mjs

  # The browser suites, in parallel. They are about 370 s of work, measured
  # one at a time, and each shard repeats about 35 s of install and build, so
  # four shards of roughly equal length are worth about 130 s of wall time
  # against 416 s for one job. More than four buys little.
  #
  # These jobs are NOT the `browser` check. Branch protection and the `deploy`
  # workflow both read a check run named exactly `browser` (deploy refuses
  # unless it sees `browser=success data=success`), so the shards are named
  # `browser-shard` and the job after them is the one called `browser`.
  #
  # The first three shards name their suites; the fourth takes everything those
  # do not (`--not`), so a suite added to test/browser/run.mjs runs somewhere
  # without anyone having to remember to list it here. Grouped by measured time
  # (seconds, locally, one at a time): progress 83 + offline 4 + speech 10;
  # verbs 68 + study 12 + keys 15; milestone 45 + sync 40 + production 15; and
  # the rest: notes 49 + language 16 + tabs 17 + storage 11.
  #
  # ubuntu-latest ships Chrome at /usr/bin/google-chrome, which the harness
  # already looks for.
  browser-shard:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: browser-shard ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      # Let every shard report, so one red suite does not hide another.
      fail-fast: false
      matrix:
        include:
          - group: 1
            suites: progress offline speech
            core: true
          - group: 2
            suites: verbs study keys
          - group: 3
            suites: milestone sync production
          - group: 4
            suites: --not progress offline speech verbs study keys milestone sync production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            .spago
            ~/.cache/spago-nodejs
          key: spago-${{ hashFiles('spago.lock') }}
      - run: npm run build
      # The contract of the built core.js, which needs the build. Once, not per shard.
      - if: matrix.core
        run: node test/core.mjs
      - run: node test/browser/run.mjs ${{ matrix.suites }}

  # The check that branch protection and `deploy` require. It runs whatever the
  # shards did (`always`), and passes only if every one of them passed: a
  # skipped or cancelled shard is not a pass, except when `changes` skipped them
  # on purpose, which is the one case where `success` is the right answer.
  browser:
    needs: [changes, browser-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "code changed: $CODE; browser-shard: $RESULT"
          if [ "$CODE" = "false" ]; then
            [ "$RESULT" = "skipped" ]
          else
            [ "$RESULT" = "success" ]
          fi
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.browser-shard.result }}
